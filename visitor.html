<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistik Pengunjung — Habib Abdul Ghani</title>
  <meta name="description" content="Statistik real-time pengunjung portfolio Habib Abdul Ghani.">
  <meta name="robots" content="noindex">
  <link href="assets/img/favicon.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #0d6efd;
      --accent2: #6610f2;
      --bg: #f8f9ff;
      --card: #ffffff;
      --border: #e4e8f0;
      --text: #1a1a2e;
      --muted: #6c757d;
    }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    .page-header {
      background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
      color: #fff; padding: 40px 0 60px;
      position: relative; overflow: hidden;
    }
    .page-header::after {
      content: '';
      position: absolute; bottom: -1px; left: 0; right: 0;
      height: 40px;
      background: var(--bg);
      clip-path: ellipse(55% 100% at 50% 100%);
    }
    .page-header .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.8); text-decoration: none;
      font-size: .85rem; font-weight: 500;
      padding: 5px 12px; border-radius: 20px;
      background: rgba(255,255,255,.12);
      transition: background .15s;
      margin-bottom: 24px;
    }
    .page-header .back-link:hover { background: rgba(255,255,255,.22); color: #fff; }
    .page-header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .page-header p { font-size: .9rem; opacity: .8; }

    /* STAT CARDS */
    .stats-row { margin-top: -28px; margin-bottom: 32px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(13,110,253,.06);
    }
    .stat-card .stat-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .stat-card .stat-label { font-size: .8rem; color: var(--muted); margin-top: 4px; font-weight: 500; }

    /* CHART AREA */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(13,110,253,.04);
    }
    .chart-card h5 { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 20px; }

    /* Simple bar chart */
    .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar {
      width: 100%; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #0d6efd, #6610f2);
      min-height: 4px;
      transition: opacity .2s;
      cursor: pointer;
      position: relative;
    }
    .bar:hover { opacity: .8; }
    .bar-label { font-size: 9px; color: var(--muted); text-align: center; }

    /* GoatCounter embed */
    .gc-iframe-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .gc-iframe-wrap iframe { display: block; width: 100%; border: none; }

    /* Setup guide */
    .setup-card {
      background: linear-gradient(135deg, #e8f0fe, #f0e8fe);
      border: 1px dashed #0d6efd;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .setup-card h5 { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
    .setup-step { display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start; }
    .step-num { min-width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .step-text { font-size: .85rem; color: var(--text); line-height: 1.5; }
    .step-text code { background: rgba(13,110,253,.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: .8rem; color: var(--accent2); }

    /* Contribution graph */
    .contrib-img { width: 100%; border-radius: 10px; border: 1px solid var(--border); }

    /* Footer */
    .page-footer { text-align: center; padding: 32px 0; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 40px; }
    .page-footer a { color: var(--accent); text-decoration: none; }

    .container { max-width: 860px; margin: 0 auto; padding: 0 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 20px; }
    .col-auto { flex: 1; min-width: 180px; }
    @media (max-width: 600px) {
      .col-auto { min-width: 140px; }
      .page-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="page-header">
  <div class="container">
    <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Kembali ke Portfolio</a>
    <h1>Statistik Pengunjung</h1>
    <p>habibabdulghani.vercel.app · Real-time via GoatCounter</p>
  </div>
</div>

<div class="container">

  <!-- STAT CARDS -->
  <div class="stats-row">
    <div class="row">
      <div class="col-auto">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">—</div>
          <div class="stat-label">Total Kunjungan</div>
        </div>
      </div>
      <div class="col-auto">
        <div class="stat-card">
          <div class="stat-value" id="statToday">—</div>
          <div class="stat-label">Hari Ini</div>
        </div>
      </div>
      <div class="col-auto">
        <div class="stat-card">
          <div class="stat-value" id="statWeek">—</div>
          <div class="stat-label">7 Hari Terakhir</div>
        </div>
      </div>
    </div>
  </div>



  <!-- GITHUB CONTRIBUTION -->
  <div class="chart-card">
    <h5><i class="bi bi-github me-2"></i>Aktivitas GitHub — @Kaga-nim</h5>
    <a href="https://github.com/Kaga-nim" target="_blank">
      <img class="contrib-img" src="https://ghchart.rshah.org/0d6efd/Kaga-nim" alt="GitHub Contributions" loading="lazy">
    </a>
    <div style="margin-top:16px;">
      <a href="https://github.com/Kaga-nim" target="_blank"
         style="display:inline-flex; align-items:center; gap:7px; background:#24292f; color:#fff; text-decoration:none; padding:8px 18px; border-radius:7px; font-size:.82rem; font-weight:600;">
        <i class="bi bi-github"></i> Kunjungi Profil GitHub
      </a>
    </div>
  </div>

</div><!-- /container -->

<div class="page-footer">
  <div class="container">
    <p>© 2025 <strong>Habib Abdul Ghani</strong> · <a href="index.html">Kembali ke Portfolio</a> · <a href="https://www.goatcounter.com/" target="_blank">GoatCounter</a> — Privacy-friendly analytics</p>
  </div>
</div>

<script>
  const GC_CODE = 'habibabdulghani';

  // Load all stats dari satu sumber: Vercel serverless function
  fetch('/api/stats')
    .then(r => r.json())
    .then(d => {
      if (d.total !== undefined) document.getElementById('statTotal').textContent = Number(d.total).toLocaleString('id-ID');
      if (d.today !== undefined) document.getElementById('statToday').textContent = Number(d.today).toLocaleString('id-ID');
      if (d.week !== undefined) document.getElementById('statWeek').textContent = Number(d.week).toLocaleString('id-ID');
    })
    .catch(() => {});
</script>

</body>
</html>
